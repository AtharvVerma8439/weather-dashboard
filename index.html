<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Live Weather Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #090d16, #0f172a, #1e1b4b, #090d16);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      padding: 30px 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Bigger Container with Float Animation */
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: floatContainer 6s ease-in-out infinite;
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .search-box {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px 20px;
      border-radius: 14px;
      border: 2px solid #38bdf8;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      font-size: 1.2rem;
      outline: none;
      transition: 0.3s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    button {
      padding: 16px 30px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    /* Weather Card with Smooth Fade & Slide Animation */
    .weather-card {
      display: none;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 35px;
      margin-top: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.6s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .city-name {
      font-size: 2rem;
      margin-bottom: 5px;
      color: #38bdf8;
      font-weight: 600;
    }

    .temp {
      font-size: 5rem;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .condition {
      font-size: 1.4rem;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    /* Grid for Extra Details */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    .detail-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    .detail-box span {
      display: block;
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 6px;
    }

    .error-msg {
      color: #f87171;
      margin-top: 15px;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌍 Weather Hub</h1>
    <p class="subtitle">Global live meteorological dashboard</p>
    
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search city (e.g., Tokyo, New York)">
      <button id="searchBtn">Explore</button>
    </div>

    <p class="error-msg" id="errorMsg">City not found. Please check spelling and try again.</p>

    <div class="weather-card" id="weatherCard">
      <div class="city-name" id="cityName">-</div>
      <div class="temp" id="tempValue">0°C</div>
      <div class="condition" id="conditionText">-</div>
      
      <div class="details-grid">
        <div class="detail-box">
          Wind Speed
          <span id="windSpeed">0 km/h</span>
        </div>
        <div class="detail-box">
          Humidity
          <span id="humidityVal">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const weatherCard = document.getElementById('weatherCard');
    const cityName = document.getElementById('cityName');
    const tempValue = document.getElementById('tempValue');
    const conditionText = document.getElementById('conditionText');
    const windSpeed = document.getElementById('windSpeed');
    const humidityVal = document.getElementById('humidityVal');
    const errorMsg = document.getElementById('errorMsg');

    searchBtn.addEventListener('click', getWeather);
    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') getWeather();
    });

    async function getWeather() {
      const query = cityInput.value.trim();
      if (!query) return;

      errorMsg.style.display = 'none';
      weatherCard.style.display = 'none';

      try {
        // Step 1: Geocoding lookup
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          errorMsg.style.display = 'block';
          return;
        }

        const location = geoData.results[0];
        const { latitude, longitude, name, country } = location;

        // Step 2: Fetch weather data including humidity & wind
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`);
        const weatherData = await weatherRes.json();

        const current = weatherData.current;

        // Populate dashboard elements
        cityName.textContent = `${name}, ${country || ''}`;
        tempValue.textContent = `${Math.round(current.temperature_2m)}°C`;
        windSpeed.textContent = `${current.wind_speed_10m} km/h`;
        humidityVal.textContent = `${current.relative_humidity_2m}%`;
        
        conditionText.textContent = getWeatherDescription(current.weather_code);

        weatherCard.style.display = 'block';
      } catch (err) {
        errorMsg.style.display = 'block';
        console.error(err);
      }
    }

    function getWeatherDescription(code) {
      if (code === 0) return '☀️ Crystal Clear Sky';
      if (code >= 1 && code <= 3) return '⛅ Partly Cloudy & Bright';
      if (code >= 45 && code <= 48) return '🌫️ Foggy & Misty Conditions';
      if (code >= 51 && code <= 67) return '🌧️ Steady Showers';
      if (code >= 71 && code <= 77) return '❄️ Snowfall Active';
      if (code >= 95) return '⚡ Severe Thunderstorms';
      return '🌤️ Pleasant Atmosphere';
    }
  </script>
</body>
</html>
