<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #090d16, #1e293b, #0369a1, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Bigger Container with Smooth Fade-in Animation */
    .container {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 25px;
      color: #38bdf8;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      font-size: 1.1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    button {
      padding: 16px 25px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
    }

    /* Enhanced Weather Card */
    .weather-card {
      display: none;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 18px;
      padding: 35px 25px;
      margin-top: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .city-name {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #38bdf8;
      font-weight: 600;
    }

    .temp {
      font-size: 4.5rem;
      font-weight: 800;
      margin: 15px 0;
      color: #ffffff;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .condition {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #e2e8f0;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    .loading-msg {
      margin: 20px 0;
      font-size: 1.2rem;
      color: #38bdf8;
    }

    .error-msg {
      color: #f87171;
      margin-top: 15px;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌦️ Live Weather</h1>
    
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search any city...">
      <button id="searchBtn">Search</button>
    </div>

    <div class="loading-msg" id="loadingMsg">Detecting your location...</div>
    <p class="error-msg" id="errorMsg">Could not retrieve weather data. Please try another city.</p>

    <div class="weather-card" id="weatherCard">
      <div class="city-name" id="cityName">-</div>
      <div class="temp" id="tempValue">0°C</div>
      <div class="condition" id="conditionText">-</div>
      
      <div class="details">
        <div>Wind Speed: <span id="windSpeed">0 km/h</span></div>
      </div>
    </div>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const weatherCard = document.getElementById('weatherCard');
    const cityName = document.getElementById('cityName');
    const tempValue = document.getElementById('tempValue');
    const conditionText = document.getElementById('conditionText');
    const windSpeed = document.getElementById('windSpeed');
    const errorMsg = document.getElementById('errorMsg');
    const loadingMsg = document.getElementById('loadingMsg');

    searchBtn.addEventListener('click', () => getWeatherByCity(cityInput.value.trim()));
    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') getWeatherByCity(cityInput.value.trim());
    });

    // Automatically check location on page load
    window.addEventListener('load', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            getWeatherByCoords(lat, lon, "Your Current Location");
          },
          () => {
            // If user blocks location or error occurs, hide loading and let them search manually
            loadingMsg.style.display = 'none';
          }
        );
      } else {
        loadingMsg.style.display = 'none';
      }
    });

    async function getWeatherByCity(query) {
      if (!query) return;

      errorMsg.style.display = 'none';
      weatherCard.style.display = 'none';
      loadingMsg.style.display = 'block';
      loadingMsg.textContent = 'Searching city...';

      try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          loadingMsg.style.display = 'none';
          errorMsg.style.display = 'block';
          return;
        }

        const location = geoData.results[0];
        getWeatherByCoords(location.latitude, location.longitude, `${location.name}, ${location.country || ''}`);
      } catch (err) {
        loadingMsg.style.display = 'none';
        errorMsg.style.display = 'block';
      }
    }

    async function getWeatherByCoords(lat, lon, displayName) {
      try {
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const weatherData = await weatherRes.json();

        const current = weatherData.current_weather;

        cityName.textContent = displayName;
        tempValue.textContent = `${current.temperature}°C`;
        windSpeed.textContent = `${current.windspeed} km/h`;
        conditionText.textContent = getWeatherDescription(current.weathercode);

        loadingMsg.style.display = 'none';
        weatherCard.style.display = 'block';
      } catch (err) {
        loadingMsg.style.display = 'none';
        errorMsg.style.display = 'block';
      }
    }

    function getWeatherDescription(code) {
      if (code === 0) return '☀️ Clear sky';
      if (code >= 1 && code <= 3) return '⛅ Partly cloudy';
      if (code >= 51 && code <= 67) return '🌧️ Rain showers';
      if (code >= 71 && code <= 77) return '❄️ Snowfall';
      if (code >= 95) return '⚡ Thunderstorm';
      return '🌤️ Fair weather';
    }
  </script>
</body>
</html>
